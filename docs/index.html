<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Un pequeño universo de píxeles, estrellas y campanitas para tocar y descubrir.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Pequeño Cosmos</title>
</head>
<body>
  <main id="universe">
    <canvas id="sky" aria-label="Universo interactivo: toca los marcianitos o dibuja estrellas con los dedos"></canvas>
    <header class="hud">
      <span class="wordmark" aria-hidden="true"><span>✦</span> pequeño cosmos</span>
      <button id="sound" class="sound" aria-label="Silenciar sonido" aria-pressed="false" title="Silenciar sonido">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="waves" d="M17 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/><path class="slash" d="m17 9 5 6m0-6-5 6"/></svg>
      </button>
    </header>
    <section id="welcome" aria-labelledby="title">
      <div class="intro">
        <span class="tiny-star" aria-hidden="true">✦</span>
        <h1 id="title">pequeño<br><span>cosmos</span></h1>
        <p>Un universo en tus manos.</p>
        <button id="play"><span aria-hidden="true">▶</span> Jugar</button>
        <span class="caption">tocar · descubrir · sonreír</span>
      </div>
    </section>
    <span id="safe-area" aria-hidden="true"></span>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
